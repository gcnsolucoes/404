<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>504 Tempo Limite do Gateway — Vixpi Host</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --primary:hsl(215,80%,48%);
  --primary-dark:hsl(215,80%,40%);
  --primary-dim:rgba(24,106,220,.07);
  --primary-border:rgba(24,106,220,.18);

  --base:hsl(215,60%,12%);
  --muted:hsl(215,30%,55%);
  --subtle:hsl(215,20%,78%);

  --bg:hsl(40,20%,96%);
  --bg-card:#fff;
  --bg-footer:hsl(40,15%,94%);

  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.13);

  --error:hsl(0,72%,51%);
  --error-dim:rgba(204,42,42,.07);
  --error-border:rgba(204,42,42,.18);
  --warning:hsl(32,95%,44%);
  --warning-dim:rgba(210,110,8,.07);
  --warning-border:rgba(210,110,8,.18);
  --ok:hsl(142,71%,38%);

  --acc:var(--primary);
  --acc-dim:var(--primary-dim);
  --acc-border:var(--primary-border);

  --font:'Onest',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Monaco,Consolas,monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 8px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --shadow-lg:0 16px 32px rgba(0,0,0,.08),0 4px 8px rgba(0,0,0,.05);
}

html,body{min-height:100%;height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--base);
  min-height:100dvh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:rgba(24,106,220,.15);color:var(--base)}

/* Dot grid — very subtle, vixpi uses something like this */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(0,0,0,.038) 1px,transparent 1px);
  background-size:28px 28px;
}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:1280px;margin:0 auto;
  display:flex;flex-direction:column;min-height:100dvh;
}

/* ── Header ── */
.header{
  height:64px;padding:0 40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.logo{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--base);
}
.logo img{height:34px;width:auto;display:block}
.logo-name{
  font-size:15px;font-weight:700;
  color:var(--base);letter-spacing:-.01em;
}

/* status badge — static, no animation */
.status-badge{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 11px;border-radius:6px;
  font-family:var(--font-mono);font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--acc-border);
  background:var(--acc-dim);
  color:var(--acc);
}
/* static dot — no pulse */
.status-badge .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--acc);flex-shrink:0;
}

/* ── Operational strip ── */
.strip{
  padding:8px 40px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);
  font-family:var(--font-mono);flex-shrink:0;
  background:var(--bg);
}
.strip-ok{
  display:flex;align-items:center;gap:5px;
  color:var(--ok);font-weight:600;
}
.strip-ok::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--ok);flex-shrink:0;
}
.strip-sep{color:var(--subtle);margin:0 2px}

/* ── Main ── */
.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:72px 40px;text-align:center;
}
.content{
  display:flex;flex-direction:column;align-items:center;
  max-width:480px;width:100%;
}

/* icon card — clean white card, no glow */
.icon-card{
  width:56px;height:56px;border-radius:14px;
  background:var(--bg-card);
  border:1px solid var(--acc-border);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.icon-card svg{
  width:22px;height:22px;
  stroke:var(--acc);fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
}

/* error code */
.code{
  font-size:clamp(60px,12vw,100px);
  font-weight:800;letter-spacing:-.05em;line-height:.95;
  margin-bottom:16px;color:var(--acc);
  font-family:var(--font-mono);
}
.title{
  font-size:clamp(20px,2.8vw,26px);
  font-weight:700;letter-spacing:-.025em;
  color:var(--base);margin-bottom:12px;line-height:1.2;
}
.desc{
  font-size:15px;line-height:1.70;
  font-weight:400;color:var(--muted);
  margin-bottom:40px;
}

/* buttons — exact vixpi style */
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:40px;padding:0 20px;border-radius:8px;
  font-family:var(--font);font-size:13.5px;font-weight:600;
  text-decoration:none;cursor:pointer;
  transition:background .15s,box-shadow .15s,border-color .15s;
  white-space:nowrap;line-height:1;
}
.btn svg{
  width:14px;height:14px;flex-shrink:0;
  stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}
.btn-ghost{
  border:1px solid var(--border-strong);
  background:var(--bg-card);
  color:var(--base);
  box-shadow:var(--shadow-sm);
}
.btn-ghost:hover{
  border-color:rgba(0,0,0,.20);
  box-shadow:var(--shadow-md);
}
.btn-primary{
  border:1px solid transparent;
  background:var(--primary);
  color:#fff;
  box-shadow:0 2px 6px rgba(24,106,220,.25);
}
.btn-primary:hover{
  background:var(--primary-dark);
  box-shadow:0 4px 12px rgba(24,106,220,.35);
}

/* ── Footer ── */
.footer{
  padding:18px 40px;flex-shrink:0;
  border-top:1px solid var(--border);
  background:var(--bg-footer);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.footer-copy{
  font-size:12px;color:var(--muted);
}
.footer-links{
  display:flex;align-items:center;gap:24px;
  font-size:12px;font-family:var(--font-mono);
}
.footer-links a{
  color:var(--muted);text-decoration:none;
  transition:color .15s;letter-spacing:.02em;
}
.footer-links a:hover{color:var(--primary)}

@media(max-width:640px){
  .header,.strip,.footer{padding-left:20px;padding-right:20px}
  .main{padding:56px 20px}
  .logo-name{display:none}
  .footer-links{gap:16px}
}
:root{--acc:var(--error);--acc-dim:var(--error-dim);--acc-border:var(--error-border)}
  </style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <a href="https://vixpi.host" class="logo" aria-label="Vixpi Host">
      <img src="https://vixpi.host/storage/logo-light.svg" alt="Vixpi Host" height="34">
      <span class="logo-name">Vixpi Host</span>
    </a>
    <span class="status-badge">
      <span class="dot" aria-hidden="true"></span>
      HTTP 504
    </span>
  </header>

  <div class="strip">
    <span class="strip-ok">Infraestrutura operacional</span>
    <span class="strip-sep">/</span>
    <span>São Paulo, Brasil</span>
    <span class="strip-sep">/</span>
    <span>SLA 99.98%</span>
  </div>

  <main class="main">
    <div class="content">

      <div class="icon-card" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>

      <div class="code">504</div>
      <h1 class="title">Tempo Limite do Gateway</h1>
      <p class="desc">O servidor upstream demorou para responder. Tente novamente em instantes.</p>

      <div class="actions">
        <button class="btn btn-ghost" onclick="history.back()" type="button">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="15 18 9 12 15 6"/></svg>Voltar
        </button>
        <a href="https://vixpi.host" class="btn btn-primary">
          Vixpi Host<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>

    </div>
  </main>

  <footer class="footer">
    <span class="footer-copy">Vixpi Host — GCN Tecnologia da Informação LTDA</span>
    <nav class="footer-links" aria-label="Links">
      <a href="https://vixpi.host">vixpi.host</a>
      <a href="https://github.com/gcnsolucoes/404" target="_blank" rel="noopener noreferrer">github</a>
      <a href="mailto:contato@vixpi.host">contato@vixpi.host</a>
    </nav>
  </footer>

</div>
</body>
</html>
