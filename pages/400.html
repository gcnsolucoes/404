<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>400 — Requisição Inválida · GCN Soluções</title>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--grid-dot:rgba(0,0,0,.07);--border:rgba(0,0,0,.1);
  --surface:#fff;--surface-hover:rgba(0,0,0,.04);
  --text:#0a0a0a;--text-muted:#525252;--text-subtle:#a3a3a3;
  --accent:#f43f5e;--accent-dim:rgba(244,63,94,.09);--accent-border:rgba(244,63,94,.22);
  --radius:8px;
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c0c0c;--grid-dot:rgba(255,255,255,.05);--border:rgba(255,255,255,.09);
    --surface:rgba(255,255,255,.04);--surface-hover:rgba(255,255,255,.07);
    --text:#fafafa;--text-muted:#a3a3a3;--text-subtle:#404040;
    --accent-dim:rgba(244,63,94,.12);--accent-border:rgba(244,63,94,.3);
  }
}
html,body{min-height:100%}
body{
  display:flex;flex-direction:column;min-height:100dvh;
  font-family:var(--font-sans);background-color:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{
  width:100%;max-width:80rem;margin:0 auto;
  border-left:1px dashed var(--border);border-right:1px dashed var(--border);
  display:flex;flex-direction:column;min-height:100dvh;
}
.divider{height:0;position:relative;overflow:visible}
.divider::after{content:'';position:absolute;top:-1px;left:0;right:0;border-top:1px dashed var(--border)}
/* header */
.header{
  padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.logo-mark{
  width:22px;height:22px;background:var(--accent);border-radius:5px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo-mark svg{width:12px;height:12px;fill:#fff}
.logo-name{font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--text)}
.badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;
  border-radius:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--accent-border);background:var(--accent-dim);color:var(--accent);
}
.badge svg{width:9px;height:9px;fill:var(--accent);flex-shrink:0}
/* main */
.main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 28px;text-align:center;position:relative;overflow:hidden;
}
.bg-code{
  position:absolute;font-family:var(--font-mono);
  font-size:clamp(140px,30vw,280px);font-weight:700;letter-spacing:-.04em;
  user-select:none;pointer-events:none;
  color:var(--text);opacity:.04;
  top:50%;left:50%;transform:translate(-50%,-50%);
  white-space:nowrap;z-index:0;line-height:1;
}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.icon-wrap{
  width:44px;height:44px;border-radius:11px;
  background:var(--accent-dim);border:1px solid var(--accent-border);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;color:var(--accent);
}
.icon-wrap svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.code{
  font-family:var(--font-mono);font-size:clamp(48px,10vw,80px);font-weight:700;
  letter-spacing:-.03em;color:var(--text);line-height:1;margin-bottom:14px;
}
.title{
  font-size:clamp(17px,2.5vw,21px);font-weight:500;color:var(--text);
  margin-bottom:12px;letter-spacing:-.01em;
}
.desc{
  font-size:15px;color:var(--text-muted);max-width:380px;line-height:1.65;
  font-weight:300;margin-bottom:40px;
}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;
  border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  transition:background .15s,color .15s,border-color .15s;font-family:inherit;
}
.btn:hover{background:var(--surface-hover);color:var(--text)}
.btn-primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.btn-primary:hover{opacity:.86;color:#fff}
/* footer */
.footer{
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--text-subtle);flex-shrink:0;
}
.footer a{color:var(--text-subtle);text-decoration:none;transition:color .15s}
.footer a:hover{color:var(--text-muted)}
.footer-links{display:flex;align-items:center;gap:14px;font-family:var(--font-mono)}
.footer-copy{font-family:var(--font-mono)}
@media(max-width:640px){
  .header,.footer{padding:0 18px}
  .main{padding:60px 18px}
}
  :root{--accent:#f59e0b;
    --accent-dim:rgba(245,158,11,.09);
    --accent-border:rgba(245,158,11,.22);}
  @media(prefers-color-scheme:dark){:root{--accent-dim:rgba(245,158,11,.12);
    --accent-border:rgba(245,158,11,.3);}}
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Header -->
    <header class="header">
      <a href="/" class="logo" aria-label="GCN Soluções">
        <div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" style="width:13px;height:13px;fill:#fff;flex-shrink:0"><path d="M6 1a5 5 0 1 0 5 5H6V4h4.9A5 5 0 0 0 6 1z"/></svg></div>
        <span class="logo-name">GCN</span>
      </a>
      <span class="badge" aria-label="Código de erro 400">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="4" cy="4" r="3"/></svg>
        400
      </span>
    </header>

    <div class="divider" role="separator"></div>

    <!-- Main content -->
    <main class="main">
      <div class="bg-code" aria-hidden="true">400</div>
      <div class="content">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        </div>
        <div class="code" aria-hidden="true">400</div>
        <h1 class="title">Requisição Inválida</h1>
        <p class="desc">O servidor não conseguiu interpretar a requisição. Verifique os parâmetros e o formato dos dados enviados.</p>
        <div class="actions">
          <button class="btn" onclick="history.back()" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            Voltar
          </button>
          <a href="/" class="btn btn-primary">
            Início
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
        </div>
      </div>
    </main>

    <div class="divider" role="separator"></div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-copy">gcnsolucoes.com.br</span>
      <nav class="footer-links" aria-label="Links úteis">
        <a href="https://vixpi.host" target="_blank" rel="noopener noreferrer">vixpi.host</a>
        <a href="https://github.com/gcnsolucoes/404" target="_blank" rel="noopener noreferrer">github</a>
      </nav>
    </footer>

  </div>
</body>
</html>
